name: Backfill Tado Energy IQ history

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Upload readings to Tado (false only creates a preview)"
        required: true
        default: false
        type: boolean
      years:
        description: "Years of Octopus history"
        required: true
        default: "3"
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      TADO_EMAIL: ${{ secrets.TADO_EMAIL }}
      TADO_PASSWORD: ${{ secrets.TADO_PASSWORD }}
      OCTOPUS_MPRN: ${{ secrets.OCTOPUS_MPRN }}
      OCTOPUS_GAS_SERIAL: ${{ secrets.OCTOPUS_GAS_SERIAL }}
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate secrets
        shell: bash
        run: |
          missing=0
          for name in TADO_EMAIL TADO_PASSWORD OCTOPUS_MPRN OCTOPUS_GAS_SERIAL OCTOPUS_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or empty"
              missing=1
            fi
          done
          exit "$missing"

      - name: Preview or apply backfill
        shell: bash
        run: |
          args=(--years "${{ inputs.years }}")
          if [ "${{ inputs.apply }}" = "true" ]; then
            args+=(--apply)
          fi
          python -u backfill_octopus_to_tado.py "${args[@]}"

      - name: Upload preview CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tado-backfill-preview
          path: tado-backfill-preview.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Tado login diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tado-login-debug
          path: tado-login-result.png
          if-no-files-found: ignore
          retention-days: 1
